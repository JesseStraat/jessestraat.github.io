---
layout: default
---
<span class="Z3988" title="ctx_ver=Z39.88-2004&rft_val_fmt=info:ofi/fmt:kev:mtx:journal&rft.genre=blogPost&rft.title={{ page.title | url_encode }}&rft.date={{ page.date | date_to_xmlschema }}{% for tag in page.tags %}&rft.subject={{ tag | url_encode }}{% endfor %}&rft.au=Jesse Straat&rft_id={{ site.url }}{{ site.baseurl }}{{ page.url }}"></span>

<article itemscope itemtype="http://schema.org/BlogPosting">
  <h2 itemprop="name headline">{{ page.title | escape }}</h2>
  <p class="text-muted" style="font-size: 0.875rem;">
    <time datetime="{{ page.date | date_to_xmlschema }}" itemprop="datePublished">{{ page.date | date: "%b %-d, %Y" }}</time>
    {% if page.author %} &middot; <span itemprop="author">{{ page.author }}</span>{% endif %}
  </p>
  <div itemprop="articleBody">
    {{ content }}
  </div>
</article>
